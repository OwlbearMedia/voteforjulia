# New Relic alerting setup for voteforjulia. Account 8127277.
# Run in order; each step's output feeds the next.
#
# EXECUTED 2026-08-19 against account 8127277 with the New Relic CLI. Everything
# below has been run and the resulting objects read back, so this is a record of
# what exists rather than a proposal. Live IDs are noted inline.
#
# Rebuild with:
#   newrelic nerdgraph query 'mutation(...) {...}' --variablesFile vars.json
#
# Two operational notes that cost real time:
#
# - **The CLI prints `{}` for a successful mutation as often as a failed one.**
#   It is not a status. Three workflow creations failed silently this way. Add
#   `--trace` and read the `request completed` body, or read the object back.
# - **Complex NRQL and templates go in `--variablesFile`, not inline.** Shell
#   quoting around a GraphQL string containing NRQL string literals is where the
#   first hour went.
#
# Sections 5-8 alert on signals the host cannot drop — see ADR-0021. This host
# delivers roughly 3% of its APM transactions, so anything conditioned on
# `Transaction` alone is measuring a sample it cannot size. `SyntheticCheck` is
# collected by New Relic and is complete.

# ─────────────────────────────────────────────────────────────────────────────
# 1. Synthetic monitor — production
# ─────────────────────────────────────────────────────────────────────────────
# shouldBypassHeadRequest is required: a SIMPLE monitor sends HEAD by default,
# which returns no body, and the body is what we need to validate.

mutation CreateProductionMonitor {
  syntheticsCreateSimpleMonitor(
    accountId: 8127277
    monitor: {
      name: "voteforjulia-api /health/deep"
      uri: "https://api.voteforjulia.com/health/deep"
      period: EVERY_15_MINUTES
      status: ENABLED
      locations: { public: ["AWS_US_EAST_2", "AWS_US_WEST_1"] }
      advancedOptions: {
        shouldBypassHeadRequest: true
        redirectIsFailure: true
        useTlsValidation: true
        responseValidationText: "\"status\":\"ok\""
      }
      tags: [
        { key: "env", values: ["production"] }
        { key: "service", values: ["voteforjulia-api"] }
      ]
    }
  ) {
    monitor { guid name period status }
    errors { description type }
  }
}

# ─────────────────────────────────────────────────────────────────────────────
# 2. Synthetic monitor — test (optional, and deliberately NOT wired to alerts)
# ─────────────────────────────────────────────────────────────────────────────

mutation CreateTestMonitor {
  syntheticsCreateSimpleMonitor(
    accountId: 8127277
    monitor: {
      name: "voteforjulia-api-test /health/deep"
      uri: "https://test-api.voteforjulia.com/health/deep"
      period: EVERY_30_MINUTES
      status: ENABLED
      locations: { public: ["AWS_US_EAST_2"] }
      advancedOptions: {
        shouldBypassHeadRequest: true
        useTlsValidation: true
        responseValidationText: "\"status\":\"ok\""
      }
      tags: [{ key: "env", values: ["test"] }]
    }
  ) {
    monitor { guid name }
    errors { description type }
  }
}

# ─────────────────────────────────────────────────────────────────────────────
# 3. Alert policies — there are two, and the split is load-bearing
# ─────────────────────────────────────────────────────────────────────────────
# PER_CONDITION on both, so an SMTP outage and a Sheets outage open separate
# issues rather than collapsing into one.
#
# WHICH POLICY A CONDITION SITS ON DECIDES WHO IS EMAILED. Julia's workflow
# filters on `labels.policyIds` and nothing else, so putting a condition on
# 7922533 puts it in the candidate's inbox. There is no safe default.
#
# Why not one policy and a condition-name filter: `AiWorkflowsPredicateInput
# .attribute` is an unvalidated String. A wrong attribute name is accepted,
# matches nothing, and leaves a workflow that reports healthy and never fires —
# on the path to a non-technical stakeholder, the worst available failure.
# `labels.policyIds` is the shape proven working in this account. See ADR-0022.
#
#   7831111  voteforjulia — API                 engineer only
#   7922533  voteforjulia — Campaign visible    engineer + Julia

mutation CreateEngineerPolicy {
  alertsPolicyCreate(
    accountId: 8127277
    policy: { name: "voteforjulia — API", incidentPreference: PER_CONDITION }
  ) {
    id
    name
  }
}

mutation CreateCampaignVisiblePolicy {
  alertsPolicyCreate(
    accountId: 8127277
    policy: {
      name: "voteforjulia — Campaign visible"
      incidentPreference: PER_CONDITION
    }
  ) {
    id
    name
  }
}

# → live: <POLICY_ID> = 7831111, <CAMPAIGN_POLICY_ID> = 7922533

# ─────────────────────────────────────────────────────────────────────────────
# 4. Condition: dependency check failing
# ─────────────────────────────────────────────────────────────────────────────
# This is the one that would have caught the 2026-07-30 SMTP outage.
#
# The aggregation window MUST track the monitor's period. Empty windows are
# filled with 0 and thresholdOccurrences is ALL, so a window shorter than the
# period guarantees a filled-zero window between checks and the condition can
# never stay above the threshold — it stops firing silently, which is the worst
# way for an alert to fail.
#
# So: aggregationWindow == period (900), thresholdDuration == 2 x period (1800),
# which keeps the original intent of two consecutive failures before paging.
# Detection takes ~30 minutes at a 15-minute period; that is the cost of the
# period, not a tuning choice. These were 300 and 600 while the monitor ran
# every 5 minutes, and moving it to EVERY_15_MINUTES on 2026-08-10 is what
# made them wrong.
#
# THE LIVE CONDITION WAS READ BACK ON 2026-08-19 AND IT WAS WRONG. The previous
# copy (64880222) still had aggregationWindow 300 and thresholdDuration 600 --
# the 5-minute values. This file was corrected on 2026-08-10; the live condition
# never was, so the arithmetic above applied and **it had been unable to fire for
# nine days**. It was deleted and recreated as 66281097 with the values here.
#
# A user API key can read the signal block that the read-only MCP server cannot.
# Re-check after any period change:
#
#   newrelic nerdgraph query 'query { actor { account(id: 8127277) { alerts {
#     nrqlCondition(id: "66281097") { ... on AlertsNrqlStaticCondition {
#       signal { aggregationWindow } terms { thresholdDuration } } } } } } }
#
# On the CAMPAIGN VISIBLE policy: this is one of the two conditions Julia hears
# about. Live id 66281097.

mutation ConditionSyntheticFailure {
  alertsNrqlConditionStaticCreate(
    accountId: 8127277
    policyId: "<CAMPAIGN_POLICY_ID>"
    condition: {
      name: "API dependency check failing (production)"
      enabled: true
      nrql: {
        query: "SELECT filter(count(*), WHERE result = 'FAILED') FROM SyntheticCheck WHERE monitorName = 'voteforjulia-api /health/deep'"
      }
      signal: {
        aggregationWindow: 900
        aggregationMethod: EVENT_FLOW
        aggregationDelay: 120
        fillOption: STATIC
        fillValue: 0
      }
      terms: [
        {
          threshold: 0
          operator: ABOVE
          priority: CRITICAL
          thresholdDuration: 1800
          thresholdOccurrences: ALL
        }
      ]
      # 30 days, not the 259200 default, because this condition is on Julia's
      # workflow. New Relic force-closes an issue when this expires whether or
      # not it recovered, and a close sends her the all-clear — so at 72 hours a
      # long weekend outage would tell the candidate it was fixed while it was
      # still broken. Every condition she is wired to needs the long limit; see
      # ADR-0022.
      violationTimeLimitSeconds: 2592000
    }
  ) {
    id
    name
  }
}

# ─────────────────────────────────────────────────────────────────────────────
# 5. Condition: API serving 5xx  — REPLACES "API error rate above 5%" (64880233)
# ─────────────────────────────────────────────────────────────────────────────
# Catches failures the synthetic cannot see — a form endpoint 500ing while
# /health/deep stays green.
#
# The condition this replaces asked for `percentage(count(*), WHERE error IS
# true)`, and both halves of that were wrong here.
#
# `error IS true` is set only when an exception reaches the agent. A 503 from
# the submission cap and a 429 from either rate limiter are *returned* Flask
# responses, so the agent records a status code and no error. Read back over 30
# days, the only transactions with `error IS true` in this account were 12 HTTP
# 405s — bots probing with the wrong method. The condition was a bot detector.
#
# A *percentage* then made that worse. Recorded throughput here is 1-11
# transactions per 6 hours (ADR-0021), so a single bot probe inside a 60-second
# window is 100%, against a 5% threshold. It was one scan away from firing
# continuously.
#
# So: an absolute count of 5xx, which reads the status code directly and needs
# no exception. Verified against the account — parses, and returns 0 over 30
# days, which is the true number of 5xx responses recorded in that period.
#
# An absolute count is also the honest shape under sampling. A ratio implies a
# denominator this host cannot supply; a count says "at least this many", which
# is exactly what a sample supports.

mutation ConditionServerErrors {
  alertsNrqlConditionStaticCreate(
    accountId: 8127277
    policyId: "<POLICY_ID>"
    condition: {
      name: "API serving 5xx (production)"
      enabled: true
      nrql: {
        query: "SELECT count(*) FROM Transaction WHERE appName = 'voteforjulia-api' AND numeric(`response.status`) >= 500"
      }
      signal: {
        aggregationWindow: 300
        aggregationMethod: EVENT_FLOW
        aggregationDelay: 120
        fillOption: STATIC
        fillValue: 0
      }
      # ONE window, not two. `thresholdOccurrences: ALL` requires *every* window
      # in thresholdDuration to breach, so a 600s duration over 300s windows
      # needs a 5xx recorded in two consecutive windows. Under the sampling
      # described above that is a coin flip on a real outage and impossible for
      # a short burst of shed submissions — it would reintroduce exactly the
      # blind spot this condition replaces. Any recorded 5xx is already evidence
      # of several, so one window is the right bar.
      terms: [
        {
          threshold: 0
          operator: ABOVE
          priority: CRITICAL
          thresholdDuration: 300
          thresholdOccurrences: ALL
        }
      ]
      violationTimeLimitSeconds: 259200
    }
  ) {
    id
    name
  }
}

# ─────────────────────────────────────────────────────────────────────────────
# 6. Condition: we have gone blind — REPLACES "API not reporting" (64880240)
# ─────────────────────────────────────────────────────────────────────────────
# The intent of the old condition was right and its data source was wrong.
# "Silence is not a signal" still holds: if nothing is watching, an outage looks
# exactly like a quiet Tuesday. What changed is *whose* silence to measure.
#
# The old condition counted `Transaction` and filled empty windows with 0, so
# any 30-minute stretch with no *recorded* transaction fired it. On this host
# that is most stretches: Passenger spawns a worker per request and reaps it
# when idle (docs/hosting.md), and a worker reaped before the agent's 60-second
# harvest never ships what it recorded. It fired on 2026-08-17 (issue
# 6d261d33) during a period when the synthetic was 192/192 green. It was
# measuring worker lifetime, not availability.
#
# This one counts the synthetic's own checks instead. Those are produced by New
# Relic's infrastructure, not by a process this host can reap, so an empty
# window means the monitor genuinely stopped — disabled, out of budget, or a
# New Relic outage. That is a real thing to know and nothing else reports it.
#
# Sizing: the monitor runs EVERY_15_MINUTES from two locations, so a 900s window
# holds ~2 checks. thresholdDuration 2700 is three consecutive empty windows.
# Keep aggregationWindow equal to the monitor period for the same reason as
# section 4 — a shorter window guarantees a filled zero between checks.
#
# WARNING, not CRITICAL, and deliberately not on Julia's workflow: it means we
# cannot see, not that the site is down.

mutation ConditionMonitorNotRunning {
  alertsNrqlConditionStaticCreate(
    accountId: 8127277
    policyId: "<POLICY_ID>"
    condition: {
      name: "Synthetic monitor not running (production)"
      enabled: true
      nrql: {
        query: "SELECT count(*) FROM SyntheticCheck WHERE monitorName = 'voteforjulia-api /health/deep'"
      }
      signal: {
        aggregationWindow: 900
        aggregationMethod: EVENT_FLOW
        aggregationDelay: 180
        fillOption: STATIC
        fillValue: 0
      }
      terms: [
        {
          threshold: 1
          operator: BELOW
          priority: WARNING
          thresholdDuration: 2700
          thresholdOccurrences: ALL
        }
      ]
      violationTimeLimitSeconds: 259200
    }
  ) {
    id
    name
  }
}

# ─────────────────────────────────────────────────────────────────────────────
# 7. Condition: burst rate limiter tripping
# ─────────────────────────────────────────────────────────────────────────────
# Depends on `rate_limit.tier`, added in api/app.py. THE ATTRIBUTE MUST BE
# DEPLOYED AND REPORTING BEFORE THIS CONDITION IS CREATED. A condition on an
# attribute nothing emits is not an error — it evaluates to nothing and sits
# green forever, which is indistinguishable from working. Confirm first:
#
#   SELECT count(*) FROM Transaction
#   WHERE `rate_limit.tier` IS NOT NULL SINCE 1 day ago
#
# The burst tier (5 requests / 60s) is mostly double-clicks and scanners, so
# this is FYI-grade: a high threshold, a long duration, WARNING, and not on
# Julia's workflow. Its value is context next to a real incident, not a page.
#
# The threshold is a guess and should be tuned once there is a week of data.
# Saying so is more useful than a derived-looking number: sampling loss is
# biased — a burst keeps a worker alive long enough to harvest, an isolated
# request does not — so recorded 429s over-represent bursts by an unknown
# factor. Nobody can compute the right value from here.

mutation ConditionBurstRateLimit {
  alertsNrqlConditionStaticCreate(
    accountId: 8127277
    policyId: "<POLICY_ID>"
    condition: {
      name: "Rate limiter tripping — burst tier (production)"
      enabled: true
      nrql: {
        query: "SELECT count(*) FROM Transaction WHERE appName = 'voteforjulia-api' AND `rate_limit.tier` = 'burst'"
      }
      signal: {
        aggregationWindow: 300
        aggregationMethod: EVENT_FLOW
        aggregationDelay: 120
        fillOption: STATIC
        fillValue: 0
      }
      terms: [
        {
          threshold: 20
          operator: ABOVE
          priority: WARNING
          thresholdDuration: 900
          thresholdOccurrences: ALL
        }
      ]
      violationTimeLimitSeconds: 259200
    }
  ) {
    id
    name
  }
}

# ─────────────────────────────────────────────────────────────────────────────
# 8. Condition: hourly rate limiter tripping
# ─────────────────────────────────────────────────────────────────────────────
# The same attribute dependency as section 7 applies.
#
# This is the tier worth alerting on. The burst limiter catches anyone in a
# hurry; this one (10/hour, ADR-0016) only catches a caller that paced itself
# under the burst limit for an hour — which is either abuse or a supporter
# genuinely unable to get a form to work. Both are worth a look, and neither is
# visible any other way.
#
# CRITICAL, and this is one of the two conditions on Julia's workflow: sustained
# refusals are the case where the site is turning real people away.
#
# SCOPED TO THE TWO FORM ENDPOINTS ON PURPOSE. `/health/deep` has its own
# 30/hour allowance, and a scanner exhausting *that* says nothing about whether
# a supporter can submit a form — but this condition emails Julia "the website's
# forms may not be working". Without the scope filter the loudest, least
# meaningful caller on the API drives the candidate's inbox.

mutation ConditionHourlyRateLimit {
  alertsNrqlConditionStaticCreate(
    accountId: 8127277
    policyId: "<POLICY_ID>"
    condition: {
      name: "Rate limiter tripping — hourly tier (production)"
      enabled: true
      nrql: {
        query: "SELECT count(*) FROM Transaction WHERE appName = 'voteforjulia-api' AND `rate_limit.tier` = 'hourly' AND `rate_limit.scope` IN ('send-email', 'yard-sign')"
      }
      signal: {
        aggregationWindow: 300
        aggregationMethod: EVENT_FLOW
        aggregationDelay: 120
        fillOption: STATIC
        fillValue: 0
      }
      terms: [
        {
          threshold: 5
          operator: ABOVE
          priority: CRITICAL
          thresholdDuration: 1800
          thresholdOccurrences: ALL
        }
      ]
      violationTimeLimitSeconds: 2592000
    }
  ) {
    id
    name
  }
}

# ═════════════════════════════════════════════════════════════════════════════
# NOTIFICATIONS (sections 9-12)
# ═════════════════════════════════════════════════════════════════════════════
# Everything above raises issues. Nothing above emails anyone. Until 2026-08-19
# the `voteforjulia — API` policy had NO workflow at all: every issue it raised
# sat in the UI and reached nobody, which looks exactly like nothing going
# wrong. Conditions existing is not the same as being alerted.
#
# TWO PLATFORM CONSTRAINTS SHAPE ALL OF THIS, neither in the schema:
#
#   1. `notificationTriggers` MUST contain ACTIVATED. A workflow that fires only
#      on acknowledgement or only on closure is rejected:
#        destinationConfigurations[0].notificationTriggers: Must contain ACTIVATED
#      So "one workflow per issue state" is not expressible. Varying wording by
#      state requires ONE workflow with all three triggers and a template that
#      branches on {{state}}.
#   2. A CHANNEL BELONGS TO EXACTLY ONE WORKFLOW. Reusing one is rejected with
#        Channels ids are already in use by workflows [...]
#      Hence a separate channel per workflow even when the content is identical.
#
# ─────────────────────────────────────────────────────────────────────────────
# 9. Destinations
# ─────────────────────────────────────────────────────────────────────────────
# <JULIA_EMAIL> AND <DYLAN_EMAIL> ARE PLACEHOLDERS AND MUST STAY ONE. This
# repository is public. Substitute at the CLI, never in the file.
#
# → live: Julia Hamann = ed662313-..., Dylan Whitney = 3d0fc1da-...

mutation CreateJuliaDestination {
  aiNotificationsCreateDestination(
    accountId: 8127277
    destination: {
      type: EMAIL
      name: "Julia Hamann"
      properties: [{ key: "email", value: "<JULIA_EMAIL>" }]
    }
  ) {
    destination { id name }
  }
}

mutation CreateDylanDestination {
  aiNotificationsCreateDestination(
    accountId: 8127277
    destination: {
      type: EMAIL
      name: "Dylan Whitney"
      properties: [{ key: "email", value: "<DYLAN_EMAIL>" }]
    }
  ) {
    destination { id name }
  }
}

# ─────────────────────────────────────────────────────────────────────────────
# 10. Julia's channel — one template, branching on issue state
# ─────────────────────────────────────────────────────────────────────────────
# Handlebars conditionals were VERIFIED against this account before anything was
# pointed at Julia, using a throwaway channel on the engineer's own address:
# `{{state}}`, `{{#if (eq state 'X')}}...{{else}}...{{/if}}`, `{{#eq}}` and a
# doubly-nested else all render. Repeat that probe before ever editing this
# template — a broken expression does not error, it emails her the source.
#
# BRANCH ORDER IS LOAD-BEARING: CLOSED first, then ACTIVATED, then everything
# else. Only an explicit CLOSED produces the all-clear, so an unexpected state
# falls through to "Dylan is looking into it" rather than telling the candidate
# her site is fixed when nobody has said so. Do not reorder.
#
# No condition names, no issue URLs, no numbers, no jargon.
#
# Send this as --variablesFile; the template will not survive shell quoting.
# → live: 1d4adef3-...

mutation CreateJuliaChannel {
  aiNotificationsCreateChannel(
    accountId: 8127277
    channel: {
      type: EMAIL
      name: "Julia - website status"
      destinationId: "<JULIA_DESTINATION_ID>"
      product: IINT
      properties: [
        {
          key: "subject"
          value: "{{#if (eq state 'CLOSED')}}Vote for Julia - the website is working normally again{{else}}{{#if (eq state 'ACTIVATED')}}Vote for Julia - the website's forms may not be working{{else}}Vote for Julia - Dylan is looking into the website problem{{/if}}{{/if}}"
        }
        {
          key: "customDetailsEmail"
          value: "{{#if (eq state 'CLOSED')}}The contact and volunteer forms on voteforjulia.com are working normally again. Automatic monitoring has confirmed it.\n\nIf anyone told you they had trouble signing up, it is worth asking them to try again.{{else}}{{#if (eq state 'ACTIVATED')}}Automatic monitoring has found a problem with the contact and volunteer forms on voteforjulia.com.\n\nSupporters trying to sign up may be seeing an error. Dylan has been alerted automatically - you do not need to call or message him.\n\nYou will get one more email when he starts looking into it, and another when it is fixed.{{else}}Dylan has seen the alert about voteforjulia.com and is working on it now.\n\nThere is nothing you need to do. You will get one more email when the forms are working normally again.{{/if}}{{/if}}"
        }
      ]
    }
  ) {
    channel { id name }
  }
}

# The engineer's two channels are plain — one per workflow, because of
# constraint 2 above. → live: e4946d19-... and 1442f0c2-...

mutation CreateDylanApiChannel {
  aiNotificationsCreateChannel(
    accountId: 8127277
    channel: {
      type: EMAIL
      name: "Dylan - all alerts"
      destinationId: "<DYLAN_DESTINATION_ID>"
      product: IINT
      properties: [{ key: "subject", value: "{{ issueTitle }}" }]
    }
  ) {
    channel { id name }
  }
}

mutation CreateDylanCampaignChannel {
  aiNotificationsCreateChannel(
    accountId: 8127277
    channel: {
      type: EMAIL
      name: "Dylan - campaign visible alerts"
      destinationId: "<DYLAN_DESTINATION_ID>"
      product: IINT
      properties: [{ key: "subject", value: "{{ issueTitle }}" }]
    }
  ) {
    channel { id name }
  }
}

# ─────────────────────────────────────────────────────────────────────────────
# 11. Workflows
# ─────────────────────────────────────────────────────────────────────────────
# Three: Julia on the campaign policy, the engineer on each policy.
#
# `issuesFilter.name` is free text but each workflow needs its own filter
# object. `mutingRulesHandling` is REQUIRED by the schema.
#
# The engineer needs one workflow PER POLICY — a third policy added later
# silently halves his coverage unless a workflow is added with it.

mutation CreateJuliaWorkflow {
  aiWorkflowsCreateWorkflow(
    accountId: 8127277
    createWorkflowData: {
      name: "Julia - website status"
      workflowEnabled: true
      destinationsEnabled: true
      mutingRulesHandling: NOTIFY_ALL_ISSUES
      issuesFilter: {
        name: "Campaign visible - Julia"
        type: FILTER
        predicates: [
          {
            attribute: "labels.policyIds"
            operator: EXACTLY_MATCHES
            values: ["<CAMPAIGN_POLICY_ID>"]
          }
        ]
      }
      destinationConfigurations: [
        {
          channelId: "<JULIA_CHANNEL_ID>"
          notificationTriggers: [ACTIVATED, ACKNOWLEDGED, CLOSED]
        }
      ]
    }
  ) {
    workflow { id name }
    errors { description type }
  }
}

# Then the same twice more for the engineer, changing name, filter name,
# channelId and the policy id in `values`:
#
#   "Dylan - voteforjulia API policy"   <POLICY_ID>           "Dylan - all alerts"
#   "Dylan - campaign visible policy"   <CAMPAIGN_POLICY_ID>  "Dylan - campaign visible alerts"
#
# both with notificationTriggers: [ACTIVATED, ACKNOWLEDGED, CLOSED].

# ─────────────────────────────────────────────────────────────────────────────
# 12. Prove the path end to end
# ─────────────────────────────────────────────────────────────────────────────
# A workflow that matches nothing is created happily and reports healthy. The
# only thing that proves delivery is sending one.
#
# Test a channel pointed at YOUR OWN address, not the candidate's. A test always
# renders state = ACTIVATED, so it exercises one branch of the template; the
# other two are covered by the probe described in section 10.

mutation TestChannel {
  aiNotificationsTestChannelById(
    accountId: 8127277
    channelId: "<CHANNEL_ID>"
  ) {
    result
    details
  }
}

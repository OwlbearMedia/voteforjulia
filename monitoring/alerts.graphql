# New Relic alerting setup for voteforjulia
# Paste into https://api.newrelic.com/graphiql — run in order, each step's
# output feeds the next. Account 8127277.
#
# NOT TESTED: the MCP server is read-only, so none of this has been executed.
# Verify field names against the explorer's schema pane as you go.
#
# Two different confidence levels live in this file, and it is worth knowing
# which you are reading:
#
# - **The NRQL has been run** against account 8127277 and parses. Where a query
#   is new, the comment says what it returned.
# - **The mutation shapes have not.** Field names for `aiNotifications*` and
#   `aiWorkflows*` (sections 9-11) are from memory and are the least trustworthy
#   thing here. Check every one against the schema pane.
#
# Sections 5-8 replace conditions built on `Transaction` data. This host drops
# most of it — see ADR-0021 — so anything alerting on the API's own telemetry is
# either measuring a sample it cannot size, or firing on silence that means
# nothing. `SyntheticCheck` is collected by New Relic and is the only complete
# signal in the account.

# ─────────────────────────────────────────────────────────────────────────────
# 1. Synthetic monitor — production
# ─────────────────────────────────────────────────────────────────────────────
# shouldBypassHeadRequest is required: a SIMPLE monitor sends HEAD by default,
# which returns no body, and the body is what we need to validate.

mutation CreateProductionMonitor {
  syntheticsCreateSimpleMonitor(
    accountId: 8127277
    monitor: {
      name: "voteforjulia-api /health/deep"
      uri: "https://api.voteforjulia.com/health/deep"
      period: EVERY_15_MINUTES
      status: ENABLED
      locations: { public: ["AWS_US_EAST_2", "AWS_US_WEST_1"] }
      advancedOptions: {
        shouldBypassHeadRequest: true
        redirectIsFailure: true
        useTlsValidation: true
        responseValidationText: "\"status\":\"ok\""
      }
      tags: [
        { key: "env", values: ["production"] }
        { key: "service", values: ["voteforjulia-api"] }
      ]
    }
  ) {
    monitor { guid name period status }
    errors { description type }
  }
}

# ─────────────────────────────────────────────────────────────────────────────
# 2. Synthetic monitor — test (optional, and deliberately NOT wired to alerts)
# ─────────────────────────────────────────────────────────────────────────────

mutation CreateTestMonitor {
  syntheticsCreateSimpleMonitor(
    accountId: 8127277
    monitor: {
      name: "voteforjulia-api-test /health/deep"
      uri: "https://test-api.voteforjulia.com/health/deep"
      period: EVERY_30_MINUTES
      status: ENABLED
      locations: { public: ["AWS_US_EAST_2"] }
      advancedOptions: {
        shouldBypassHeadRequest: true
        useTlsValidation: true
        responseValidationText: "\"status\":\"ok\""
      }
      tags: [{ key: "env", values: ["test"] }]
    }
  ) {
    monitor { guid name }
    errors { description type }
  }
}

# ─────────────────────────────────────────────────────────────────────────────
# 3. Alert policy
# ─────────────────────────────────────────────────────────────────────────────
# PER_CONDITION so an SMTP outage and a Sheets outage open separate issues
# rather than collapsing into one.

mutation CreatePolicy {
  alertsPolicyCreate(
    accountId: 8127277
    policy: { name: "voteforjulia — API", incidentPreference: PER_CONDITION }
  ) {
    id
    name
  }
}

# → note the returned id as <POLICY_ID>

# ─────────────────────────────────────────────────────────────────────────────
# 4. Condition: dependency check failing
# ─────────────────────────────────────────────────────────────────────────────
# This is the one that would have caught the 2026-07-30 SMTP outage.
#
# The aggregation window MUST track the monitor's period. Empty windows are
# filled with 0 and thresholdOccurrences is ALL, so a window shorter than the
# period guarantees a filled-zero window between checks and the condition can
# never stay above the threshold — it stops firing silently, which is the worst
# way for an alert to fail.
#
# So: aggregationWindow == period (900), thresholdDuration == 2 x period (1800),
# which keeps the original intent of two consecutive failures before paging.
# Detection takes ~30 minutes at a 15-minute period; that is the cost of the
# period, not a tuning choice. These were 300 and 600 while the monitor ran
# every 5 minutes, and moving it to EVERY_15_MINUTES on 2026-08-10 is what
# made them wrong.
#
# WHAT THE LIVE CONDITION USES IS NOT KNOWN. A condition by this name exists
# and is enabled (policy 7831111, condition 64880222), but the read-only MCP
# server cannot return a condition's signal block, so nobody has read the
# deployed aggregationWindow back. Check it in the UI before assuming this file
# matches it — the file header's "NOT TESTED" warning applies here too.

mutation ConditionSyntheticFailure {
  alertsNrqlConditionStaticCreate(
    accountId: 8127277
    policyId: "<POLICY_ID>"
    condition: {
      name: "API dependency check failing (production)"
      enabled: true
      nrql: {
        query: "SELECT filter(count(*), WHERE result = 'FAILED') FROM SyntheticCheck WHERE monitorName = 'voteforjulia-api /health/deep'"
      }
      signal: {
        aggregationWindow: 900
        aggregationMethod: EVENT_FLOW
        aggregationDelay: 120
        fillOption: STATIC
        fillValue: 0
      }
      terms: [
        {
          threshold: 0
          operator: ABOVE
          priority: CRITICAL
          thresholdDuration: 1800
          thresholdOccurrences: ALL
        }
      ]
      # 30 days, not the 259200 default, because this condition is on Julia's
      # workflow. New Relic force-closes an issue when this expires whether or
      # not it recovered, and a close sends her the all-clear — so at 72 hours a
      # long weekend outage would tell the candidate it was fixed while it was
      # still broken. Every condition she is wired to needs the long limit; see
      # ADR-0022.
      violationTimeLimitSeconds: 2592000
    }
  ) {
    id
    name
  }
}

# ─────────────────────────────────────────────────────────────────────────────
# 5. Condition: API serving 5xx  — REPLACES "API error rate above 5%" (64880233)
# ─────────────────────────────────────────────────────────────────────────────
# Catches failures the synthetic cannot see — a form endpoint 500ing while
# /health/deep stays green.
#
# The condition this replaces asked for `percentage(count(*), WHERE error IS
# true)`, and both halves of that were wrong here.
#
# `error IS true` is set only when an exception reaches the agent. A 503 from
# the submission cap and a 429 from either rate limiter are *returned* Flask
# responses, so the agent records a status code and no error. Read back over 30
# days, the only transactions with `error IS true` in this account were 12 HTTP
# 405s — bots probing with the wrong method. The condition was a bot detector.
#
# A *percentage* then made that worse. Recorded throughput here is 1-11
# transactions per 6 hours (ADR-0021), so a single bot probe inside a 60-second
# window is 100%, against a 5% threshold. It was one scan away from firing
# continuously.
#
# So: an absolute count of 5xx, which reads the status code directly and needs
# no exception. Verified against the account — parses, and returns 0 over 30
# days, which is the true number of 5xx responses recorded in that period.
#
# An absolute count is also the honest shape under sampling. A ratio implies a
# denominator this host cannot supply; a count says "at least this many", which
# is exactly what a sample supports.

mutation ConditionServerErrors {
  alertsNrqlConditionStaticCreate(
    accountId: 8127277
    policyId: "<POLICY_ID>"
    condition: {
      name: "API serving 5xx (production)"
      enabled: true
      nrql: {
        query: "SELECT count(*) FROM Transaction WHERE appName = 'voteforjulia-api' AND numeric(`response.status`) >= 500"
      }
      signal: {
        aggregationWindow: 300
        aggregationMethod: EVENT_FLOW
        aggregationDelay: 120
        fillOption: STATIC
        fillValue: 0
      }
      # ONE window, not two. `thresholdOccurrences: ALL` requires *every* window
      # in thresholdDuration to breach, so a 600s duration over 300s windows
      # needs a 5xx recorded in two consecutive windows. Under the sampling
      # described above that is a coin flip on a real outage and impossible for
      # a short burst of shed submissions — it would reintroduce exactly the
      # blind spot this condition replaces. Any recorded 5xx is already evidence
      # of several, so one window is the right bar.
      terms: [
        {
          threshold: 0
          operator: ABOVE
          priority: CRITICAL
          thresholdDuration: 300
          thresholdOccurrences: ALL
        }
      ]
      violationTimeLimitSeconds: 259200
    }
  ) {
    id
    name
  }
}

# ─────────────────────────────────────────────────────────────────────────────
# 6. Condition: we have gone blind — REPLACES "API not reporting" (64880240)
# ─────────────────────────────────────────────────────────────────────────────
# The intent of the old condition was right and its data source was wrong.
# "Silence is not a signal" still holds: if nothing is watching, an outage looks
# exactly like a quiet Tuesday. What changed is *whose* silence to measure.
#
# The old condition counted `Transaction` and filled empty windows with 0, so
# any 30-minute stretch with no *recorded* transaction fired it. On this host
# that is most stretches: Passenger spawns a worker per request and reaps it
# when idle (docs/hosting.md), and a worker reaped before the agent's 60-second
# harvest never ships what it recorded. It fired on 2026-08-17 (issue
# 6d261d33) during a period when the synthetic was 192/192 green. It was
# measuring worker lifetime, not availability.
#
# This one counts the synthetic's own checks instead. Those are produced by New
# Relic's infrastructure, not by a process this host can reap, so an empty
# window means the monitor genuinely stopped — disabled, out of budget, or a
# New Relic outage. That is a real thing to know and nothing else reports it.
#
# Sizing: the monitor runs EVERY_15_MINUTES from two locations, so a 900s window
# holds ~2 checks. thresholdDuration 2700 is three consecutive empty windows.
# Keep aggregationWindow equal to the monitor period for the same reason as
# section 4 — a shorter window guarantees a filled zero between checks.
#
# WARNING, not CRITICAL, and deliberately not on Julia's workflow: it means we
# cannot see, not that the site is down.

mutation ConditionMonitorNotRunning {
  alertsNrqlConditionStaticCreate(
    accountId: 8127277
    policyId: "<POLICY_ID>"
    condition: {
      name: "Synthetic monitor not running (production)"
      enabled: true
      nrql: {
        query: "SELECT count(*) FROM SyntheticCheck WHERE monitorName = 'voteforjulia-api /health/deep'"
      }
      signal: {
        aggregationWindow: 900
        aggregationMethod: EVENT_FLOW
        aggregationDelay: 180
        fillOption: STATIC
        fillValue: 0
      }
      terms: [
        {
          threshold: 1
          operator: BELOW
          priority: WARNING
          thresholdDuration: 2700
          thresholdOccurrences: ALL
        }
      ]
      violationTimeLimitSeconds: 259200
    }
  ) {
    id
    name
  }
}

# ─────────────────────────────────────────────────────────────────────────────
# 7. Condition: burst rate limiter tripping
# ─────────────────────────────────────────────────────────────────────────────
# Depends on `rate_limit.tier`, added in api/app.py. THE ATTRIBUTE MUST BE
# DEPLOYED AND REPORTING BEFORE THIS CONDITION IS CREATED. A condition on an
# attribute nothing emits is not an error — it evaluates to nothing and sits
# green forever, which is indistinguishable from working. Confirm first:
#
#   SELECT count(*) FROM Transaction
#   WHERE `rate_limit.tier` IS NOT NULL SINCE 1 day ago
#
# The burst tier (5 requests / 60s) is mostly double-clicks and scanners, so
# this is FYI-grade: a high threshold, a long duration, WARNING, and not on
# Julia's workflow. Its value is context next to a real incident, not a page.
#
# The threshold is a guess and should be tuned once there is a week of data.
# Saying so is more useful than a derived-looking number: sampling loss is
# biased — a burst keeps a worker alive long enough to harvest, an isolated
# request does not — so recorded 429s over-represent bursts by an unknown
# factor. Nobody can compute the right value from here.

mutation ConditionBurstRateLimit {
  alertsNrqlConditionStaticCreate(
    accountId: 8127277
    policyId: "<POLICY_ID>"
    condition: {
      name: "Rate limiter tripping — burst tier (production)"
      enabled: true
      nrql: {
        query: "SELECT count(*) FROM Transaction WHERE appName = 'voteforjulia-api' AND `rate_limit.tier` = 'burst'"
      }
      signal: {
        aggregationWindow: 300
        aggregationMethod: EVENT_FLOW
        aggregationDelay: 120
        fillOption: STATIC
        fillValue: 0
      }
      terms: [
        {
          threshold: 20
          operator: ABOVE
          priority: WARNING
          thresholdDuration: 900
          thresholdOccurrences: ALL
        }
      ]
      violationTimeLimitSeconds: 259200
    }
  ) {
    id
    name
  }
}

# ─────────────────────────────────────────────────────────────────────────────
# 8. Condition: hourly rate limiter tripping
# ─────────────────────────────────────────────────────────────────────────────
# The same attribute dependency as section 7 applies.
#
# This is the tier worth alerting on. The burst limiter catches anyone in a
# hurry; this one (10/hour, ADR-0016) only catches a caller that paced itself
# under the burst limit for an hour — which is either abuse or a supporter
# genuinely unable to get a form to work. Both are worth a look, and neither is
# visible any other way.
#
# CRITICAL, and this is one of the two conditions on Julia's workflow: sustained
# refusals are the case where the site is turning real people away.
#
# SCOPED TO THE TWO FORM ENDPOINTS ON PURPOSE. `/health/deep` has its own
# 30/hour allowance, and a scanner exhausting *that* says nothing about whether
# a supporter can submit a form — but this condition emails Julia "the website's
# forms may not be working". Without the scope filter the loudest, least
# meaningful caller on the API drives the candidate's inbox.

mutation ConditionHourlyRateLimit {
  alertsNrqlConditionStaticCreate(
    accountId: 8127277
    policyId: "<POLICY_ID>"
    condition: {
      name: "Rate limiter tripping — hourly tier (production)"
      enabled: true
      nrql: {
        query: "SELECT count(*) FROM Transaction WHERE appName = 'voteforjulia-api' AND `rate_limit.tier` = 'hourly' AND `rate_limit.scope` IN ('send-email', 'yard-sign')"
      }
      signal: {
        aggregationWindow: 300
        aggregationMethod: EVENT_FLOW
        aggregationDelay: 120
        fillOption: STATIC
        fillValue: 0
      }
      terms: [
        {
          threshold: 5
          operator: ABOVE
          priority: CRITICAL
          thresholdDuration: 1800
          thresholdOccurrences: ALL
        }
      ]
      violationTimeLimitSeconds: 2592000
    }
  ) {
    id
    name
  }
}

# ═════════════════════════════════════════════════════════════════════════════
# JULIA'S NOTIFICATIONS (sections 9-11)
# ═════════════════════════════════════════════════════════════════════════════
# Everything above tells Dylan something is wrong. These three tell Julia, in
# language that assumes nothing, and then tell her again when it is being worked
# on and when it is over. See ADR-0022.
#
# FIELD NAMES BELOW ARE UNVERIFIED — see the file header. The NRQL above was run
# against the account; these mutation shapes were not, and `aiWorkflows` in
# particular has moved between schema versions. Check each against the schema
# pane and expect to correct something.
#
# ─────────────────────────────────────────────────────────────────────────────
# 9. Destination — where Julia's mail goes
# ─────────────────────────────────────────────────────────────────────────────
# <JULIA_EMAIL> IS A PLACEHOLDER AND MUST STAY ONE. This repository is public.
# Substitute the address in the GraphiQL window, never in the file.

mutation CreateJuliaDestination {
  aiNotificationsCreateDestination(
    accountId: 8127277
    destination: {
      type: EMAIL
      name: "Julia Hamann"
      properties: [{ key: "email", value: "<JULIA_EMAIL>" }]
    }
  ) {
    destination { id name }
    error { description type }
  }
}

# → note the returned id as <JULIA_DESTINATION_ID>

# ─────────────────────────────────────────────────────────────────────────────
# 10. Channels — one per issue state, each with fixed wording
# ─────────────────────────────────────────────────────────────────────────────
# Three channels rather than one channel with a `{{#if state}}` template.
#
# The template approach is tidier and has a failure mode this one does not: if a
# handlebars helper is unavailable or an expression is malformed, New Relic
# sends the template source. The reader of these emails is a candidate mid-
# campaign, and "{{#if state}}" in her inbox during an outage is worse than the
# duplication here. Fixed prose cannot fail that way.
#
# The cost is real and belongs written down: three channels and three workflows
# repeat one filter, and nothing keeps them in step. Changing which conditions
# Julia hears about means editing all three.
#
# No issue URL and no condition name in any of these. Both lead somewhere she
# cannot act on and would only invite a "what does this mean?" at a bad moment.

mutation CreateJuliaActivatedChannel {
  aiNotificationsCreateChannel(
    accountId: 8127277
    channel: {
      type: EMAIL
      name: "Julia — problem detected"
      destinationId: "<JULIA_DESTINATION_ID>"
      product: IINT
      properties: [
        {
          key: "subject"
          value: "Vote for Julia — the website's forms may not be working"
        }
        {
          key: "customDetailsEmail"
          value: "Automatic monitoring has found a problem with the contact and volunteer forms on voteforjulia.com.\n\nSupporters trying to sign up may be seeing an error. Dylan has been alerted automatically — you do not need to call or message him.\n\nYou will get one more email when he starts looking into it, and another when it is fixed."
        }
      ]
    }
  ) {
    channel { id name }
    error { description type }
  }
}

mutation CreateJuliaAcknowledgedChannel {
  aiNotificationsCreateChannel(
    accountId: 8127277
    channel: {
      type: EMAIL
      name: "Julia — being worked on"
      destinationId: "<JULIA_DESTINATION_ID>"
      product: IINT
      properties: [
        {
          key: "subject"
          value: "Vote for Julia — Dylan is looking into the website problem"
        }
        {
          key: "customDetailsEmail"
          value: "Dylan has seen the alert about voteforjulia.com and is working on it now.\n\nThere is nothing you need to do. You will get one more email when the forms are working normally again."
        }
      ]
    }
  ) {
    channel { id name }
    error { description type }
  }
}

mutation CreateJuliaClosedChannel {
  aiNotificationsCreateChannel(
    accountId: 8127277
    channel: {
      type: EMAIL
      name: "Julia — resolved"
      destinationId: "<JULIA_DESTINATION_ID>"
      product: IINT
      properties: [
        {
          key: "subject"
          value: "Vote for Julia — the website is working normally again"
        }
        {
          key: "customDetailsEmail"
          value: "The contact and volunteer forms on voteforjulia.com are working normally again. Automatic monitoring has confirmed it.\n\nIf anyone told you they had trouble signing up, it is worth asking them to try again."
        }
      ]
    }
  ) {
    channel { id name }
    error { description type }
  }
}

# → note the three returned ids

# ─────────────────────────────────────────────────────────────────────────────
# 11. Workflows — one per trigger
# ─────────────────────────────────────────────────────────────────────────────
# Each filters the policy's issues down to the two conditions Julia should hear
# about, and fires on exactly one issue state.
#
# She is deliberately NOT wired to:
#   - "Synthetic monitor not running" — means we cannot see, not that she is
#     losing supporters. Dylan's problem.
#   - "Rate limiter tripping — burst tier" — a tripped burst limiter is the
#     defences working. Telling a candidate her site is under attack every time
#     a scanner finds it would teach her to ignore the email that matters.
#
# Repeat this mutation three times, changing `name`, `notificationTriggers` and
# `channelId` together. Getting one pair crossed sends the wrong wording for the
# state, which is the failure this section is most likely to have.

mutation CreateJuliaActivatedWorkflow {
  aiWorkflowsCreateWorkflow(
    accountId: 8127277
    createWorkflowData: {
      name: "Julia — problem detected"
      workflowEnabled: true
      destinationsEnabled: true
      # `<POLICY_ID>` here too, not the literal 7831111. The live policy is
      # 7831111, but section 3 creates one and every condition above refers to
      # whatever it returned — hardcoding the old id in only this one place
      # means a from-scratch run wires the workflows to a policy that has no
      # conditions on it, and Julia silently gets nothing.
      #
      # Both attribute names are the likeliest thing in this file to be wrong.
      # A predicate that matches nothing is not an error: the workflow is
      # created, reports healthy, and never fires. After creating these, open
      # the workflow in the UI and confirm it previews matching issues.
      issuesFilter: {
        name: "Site-affecting conditions"
        type: FILTER
        predicates: [
          {
            attribute: "labels.policyIds"
            operator: EXACTLY_MATCHES
            values: ["<POLICY_ID>"]
          }
          {
            attribute: "accumulations.conditionName"
            operator: CONTAINS
            values: ["API dependency check failing", "hourly tier"]
          }
        ]
      }
      destinationConfigurations: [
        {
          channelId: "<JULIA_ACTIVATED_CHANNEL_ID>"
          notificationTriggers: [ACTIVATED]
        }
      ]
      mutingRulesHandling: NOTIFY_ALL_ISSUES
    }
  ) {
    workflow { id name }
    errors { description type }
  }
}

# Then the same again with:
#   name: "Julia — being worked on"
#   channelId: <JULIA_ACKNOWLEDGED_CHANNEL_ID>, notificationTriggers: [ACKNOWLEDGED]
# and:
#   name: "Julia — resolved"
#   channelId: <JULIA_CLOSED_CHANNEL_ID>, notificationTriggers: [CLOSED]

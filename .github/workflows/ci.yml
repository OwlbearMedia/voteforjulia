name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-frontend:
    name: Typecheck and frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm exec vue-tsc -b

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Run frontend tests with coverage
        run: pnpm run test:coverage

      - name: Publish coverage summary
        if: always()
        run: |
          set -euo pipefail
          SUMMARY_FILE=coverage/coverage-summary.json
          if [ ! -f "$SUMMARY_FILE" ]; then
            echo "No coverage summary found at $SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          const { total } = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'));
          const row = (label, m) => `| ${label} | ${m.pct}% | ${m.covered}/${m.total} |`;
          console.log('### Frontend test coverage');
          console.log('');
          console.log('| Metric | % | Covered / Total |');
          console.log('| --- | --- | --- |');
          console.log(row('Statements', total.statements));
          console.log(row('Branches', total.branches));
          console.log(row('Functions', total.functions));
          console.log(row('Lines', total.lines));
          NODE

      - name: Upload coverage to Codecov
        # Secrets are unavailable to Dependabot runs, and a Codecov hiccup should
        # never fail CI, so guard the actor and never block the pipeline.
        if: github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  perf-frontend:
    name: Frontend performance budgets
    runs-on: ubuntu-latest
    # Runs alongside the other two jobs rather than after them. It builds from
    # scratch anyway, so gating it on the test job would only add wall-clock
    # time without changing what it can catch.
    #
    # Note this job gates deploys. deploy-production.yml keys off the whole CI
    # workflow concluding successfully, so a blown budget stops the deploy the
    # same way a failing test does — which is the intent, but it does mean a
    # genuine, accepted size increase has to land with its budget bump in the
    # same commit rather than after it.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with bundle analysis
        # ANALYZE=1 adds the treemap report, uploaded below. It writes to
        # bundle-analysis/, never into dist/, so the built output is identical
        # to a plain `pnpm build` and Lighthouse measures the real thing.
        run: pnpm run analyze

      - name: Check bundle budgets
        # Writes the per-route table to the job summary either way; exits
        # non-zero only when a route is over budget or unbudgeted.
        run: pnpm run perf:budget

      - name: Run Lighthouse CI
        # Chrome is preinstalled on the ubuntu-latest runner image and found by
        # chrome-launcher; no browser setup step is needed. Thresholds are in
        # lighthouserc.cjs — see docs/performance.md.
        run: pnpm run perf:lighthouse

      - name: Upload performance reports
        # `always()` so a failed budget or assertion still produces the reports
        # that explain it — without them the failure message is all you get.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: |
            bundle-analysis/
            .lighthouseci/
          # .lighthouseci is a dotfile directory, and upload-artifact skips
          # hidden paths by default — without this the artifact silently
          # contains only the treemap.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  test-api:
    name: Python API lint and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        # Read from .python-version rather than hardcoded here, so CI cannot
        # drift from the interpreter in the host's cPanel virtualenv — which is
        # what deploys install api/requirements.txt into. See
        # docs/hosting.md#mind-the-interpreter-floor. ruff.toml's target-version
        # tracks the same floor so lint fixes stay runnable on the host.
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install Python dependencies
        # requirements-dev.txt includes requirements.txt, so this installs the
        # runtime pins production uses plus the dev-only tooling. Nothing here
        # reaches the host: deploys install requirements.txt alone.
        run: python -m pip install -r api/requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run Python API tests with coverage
        # pytest collects every api/test_*.py, so new test files can't be
        # silently left out of CI. testpaths and import behaviour come from
        # pytest.ini; imports resolve as the top-level "api" package. Coverage
        # source/omit rules and the XML path come from .coveragerc — coverage is
        # requested here rather than in pytest.ini so a plain local `pytest`
        # stays fast, mirroring `pnpm test` vs `pnpm test:coverage`.
        run: python -m pytest --cov --cov-report=xml --cov-report=term

      - name: Publish coverage summary
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f coverage-api.xml ]; then
            echo "No coverage report found at coverage-api.xml" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage-api.xml").getroot()


          def row(label, covered, valid):
              covered, valid = int(covered), int(valid)
              pct = round(100 * covered / valid, 2) if valid else 0
              return f"| {label} | {pct}% | {covered}/{valid} |"


          print("### Python API test coverage")
          print("")
          print("| Metric | % | Covered / Total |")
          print("| --- | --- | --- |")
          print(row("Lines", root.get("lines-covered"), root.get("lines-valid")))
          print(row("Branches", root.get("branches-covered"), root.get("branches-valid")))
          PY

      - name: Upload coverage to Codecov
        # Secrets are unavailable to Dependabot runs, and a Codecov hiccup should
        # never fail CI, so guard the actor and never block the pipeline.
        if: github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-api.xml
          flags: backend
          fail_ci_if_error: false


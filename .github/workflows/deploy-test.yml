name: Deploy to test environment

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: read

# One test environment — serialize deploys so a newer run never interrupts an
# in-flight SCP upload and leaves the environment in a partially updated state.
concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  gate:
    name: Check deployment conditions
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      github.event.workflow_run.triggering_actor.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}

    steps:
      - name: Verify commit is still the HEAD of its branch and PR is open
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          current_sha=$(gh api "repos/${{ github.repository }}/git/ref/heads/${HEAD_BRANCH}" --jq '.object.sha' 2>/dev/null) || {
            echo "Branch ${HEAD_BRANCH} not found, skipping deploy."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$current_sha" != "$HEAD_SHA" ]; then
            echo "Stale re-run: ${HEAD_SHA} is not the current HEAD of ${HEAD_BRANCH} (${current_sha}), skipping deploy."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          open_prs=$(gh api "repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:${HEAD_BRANCH}" --jq 'length')
          if [ "$open_prs" == "0" ]; then
            echo "No open PR for ${HEAD_BRANCH}, skipping deploy."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  build-test-frontend:
    name: Build frontend for test environment
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history so the sitemap can date each page from its own last
          # commit — see the matching comment in deploy-production.yml.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          VITE_API_BASE_URL: https://test-api.voteforjulia.com
          SOURCEMAP_MODE: 'true'
        run: pnpm run build

      - name: Write no-index robots.txt for test deploy
        run: |
          cat > dist/robots.txt <<'EOF'
          User-agent: *
          Disallow: /
          EOF

      - name: Add noindex meta tag to built test HTML
        run: |
          find dist -type f -name '*.html' -print0 | while IFS= read -r -d '' file; do
            if grep -qi '<meta name="robots"' "$file"; then
              sed -i 's#<meta name="robots"[^>]*>#<meta name="robots" content="noindex,nofollow,noarchive" />#I' "$file"
            else
              sed -i 's#</head>#  <meta name="robots" content="noindex,nofollow,noarchive" />\n</head>#I' "$file"
            fi
          done

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: test-frontend-dist
          path: dist
          include-hidden-files: true
          retention-days: 1

  deploy-test-frontend:
    name: Deploy frontend to test environment
    needs: build-test-frontend
    runs-on: ubuntu-latest
    environment: test

    steps:
      # arm-edge-gate.sh has to be on disk before the .htaccess is uploaded, and
      # `checkout` cleans the workspace — so it runs ahead of the artifact
      # download rather than after it.
      #
      # **The default branch, NOT the PR head**, unlike every other checkout in
      # this file. This job runs the checked-out script with the edge token
      # in its environment, and the gate above admits any same-repository
      # branch — so taking the script from the PR would let an unmerged branch
      # rewrite it and read the token. The artifact stays PR-controlled: it is
      # the thing being tested. Executable deploy code is not.
      #
      # The cost is that a PR changing the gate stanza cannot be test-deployed
      # until the matching script change is on `main`, which is the merge-first
      # sequencing this control already requires of the gate itself
      # (docs/hosting.md). The pairing is covered by scripts/test_arm_edge_gate.py
      # on every CI run regardless. deploy-production.yml keeps `head_sha`
      # because there it is a commit on `main` by construction. See ADR-0020.
      - name: Check out the deploy scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: test-frontend-dist
          path: dist

      # Every step below pins the host key, and an empty `fingerprint` is not an
      # error in appleboy's actions — easyssh-proxy selects
      # InsecureIgnoreHostKey(), so an unset secret turns all of them back into
      # no verification at all, silently. Fail before the first connection
      # rather than after. See ADR-0023.
      - name: Require a pinned host key before connecting
        env:
          HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ -z "${HOST_FINGERPRINT:-}" ]; then
            echo "SSH_HOST_FINGERPRINT is unset for this environment; every SSH and SCP step in this job would skip host-key verification. Aborting." >&2
            exit 1
          fi

      - name: Prepare clean staging directory on test server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: |
            set -euo pipefail
            rm -rf ./public_html_test_next
            mkdir -p ./public_html_test_next

      - name: Upload dist contents to test staging directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: dist/**
          target: ./public_html_test_next
          overwrite: true
          strip_components: 1

      # Substituted on the runner, which is ephemeral and single-tenant, rather
      # than over SSH on the shared host where the token has to come to rest
      # anyway. What matters is that it happens in the DEPLOY job: the build
      # job's output is an artifact, and an artifact is downloadable. Every
      # guard around the substitution lives in the script, where CI can reach
      # it — see scripts/test_arm_edge_gate.py.
      #
      # This resolves to the `test` ENVIRONMENT's secret, not a repository one —
      # a different value from production's, under the same name. This pipeline
      # deploys PR-head code into api_test and a PR-built .htaccess into the
      # test docroot, either of which can read back whatever token is in scope,
      # so a value shared with production would hand any unmerged branch the
      # production edge credential. See ADR-0020.
      - name: Arm the edge gate in the .htaccess about to be uploaded
        env:
          EDGE_TOKEN: ${{ secrets.EDGE_SHARED_TOKEN }}
        run: ./scripts/arm-edge-gate.sh dist/.htaccess

      - name: Upload .htaccess to test staging directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: dist/.htaccess
          target: ./public_html_test_next
          overwrite: true
          strip_components: 1

      - name: Carry cPanel IP Blocker rules into the staged .htaccess
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: |
            set -euo pipefail
            staged=./public_html_test_next/.htaccess

            if [ ! -s "$staged" ]; then
              echo "Staged $staged is missing or empty; aborting before the swap." >&2
              exit 1
            fi

            denies=$(
              for f in ./public_html_test/.htaccess ./api_test/.htaccess; do
                [ -f "$f" ] || continue
                grep -iE '^[[:space:]]*deny[[:space:]]+from[[:space:]]+[^[:space:]]+[[:space:]]*$' "$f" || true
              done | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/[[:space:]]+/ /g' \
                   | tr 'A-Z' 'a-z' | LC_ALL=C sort -u
            )

            if [ -z "$denies" ]; then
              echo "No cPanel IP Blocker rules to carry over."
              exit 0
            fi

            {
              echo ""
              echo "# --- cPanel IP Blocker rules, carried across this deploy ---"
              echo "# Managed from cPanel > IP Blocker, never from this repo."
              echo "# Rebuilt on every deploy from the union of the live and API docroots."
              echo "<Files 403.shtml>"
              echo "order allow,deny"
              echo "allow from all"
              echo "</Files>"
              echo ""
              printf '%s\n' "$denies"
            } >> "$staged"

            # Count only — public repo, public Actions logs.
            echo "Carried over $(printf '%s\n' "$denies" | wc -l | tr -d ' ') IP Blocker rule(s)."

      - name: Atomically swap staging into the test document root
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: |
            set -euo pipefail
            if [ ! -d ./public_html_test_next ]; then
              echo "Staging directory ./public_html_test_next is missing; aborting swap." >&2
              exit 1
            fi
            # Same two-rename swap as production. Uploading straight into the live
            # root meant the e2e suite could hit new HTML while .htaccess was still
            # the old copy or mid-write — and because nothing ever pruned the
            # directory, every past deploy's hashed assets accumulated there.
            rm -rf ./public_html_test_prev
            if [ -d ./public_html_test ]; then
              mv ./public_html_test ./public_html_test_prev
            fi
            mv ./public_html_test_next ./public_html_test
            echo "Swapped new build into ./public_html_test (previous build kept at ./public_html_test_prev)."

  deploy-test-api:
    name: Deploy Python API to test environment
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      # Runtime files only — the prune step below deletes anything on the host
      # that this does not list. See deploy-production.yml for the reasoning.
      - name: Write deploy manifest
        run: |
          set -euo pipefail
          git ls-files api \
            | sed 's|^api/||' \
            | grep -v -E '(^|/)test_[^/]+\.py$' \
            | grep -v -E '^requirements-dev\.txt$' \
            | LC_ALL=C sort > api/deploy-manifest.txt
          echo "Manifest lists $(wc -l < api/deploy-manifest.txt) runtime file(s)."

      # Every step below pins the host key, and an empty `fingerprint` is not an
      # error in appleboy's actions — easyssh-proxy selects
      # InsecureIgnoreHostKey(), so an unset secret turns all of them back into
      # no verification at all, silently. Fail before the first connection
      # rather than after. See ADR-0023.
      - name: Require a pinned host key before connecting
        env:
          HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ -z "${HOST_FINGERPRINT:-}" ]; then
            echo "SSH_HOST_FINGERPRINT is unset for this environment; every SSH and SCP step in this job would skip host-key verification. Aborting." >&2
            exit 1
          fi

      # **Ordering invariant: the first connection in this job must be one whose
      # failure leaves the host untouched.** Any failure here -- a rotated host
      # key, an unreachable host -- then costs a red run and nothing else. Put
      # the scp first and the same failure lands after the new source is on
      # disk but before the install, prune and restart, so the next Passenger
      # restart boots new code against old dependencies. Asserted by
      # scripts/test_deploy_workflows.py. See ADR-0023.
      - name: Reach the server before uploading anything
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: |
            set -euo pipefail
            if [ ! -d ./api_test ]; then
              echo "App root ./api_test is missing; aborting before the upload." >&2
              exit 1
            fi
            echo "Reached the server; ./api_test is present."

      - name: Upload api contents to test api directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: api/**
          target: ./api_test
          overwrite: true
          strip_components: 1

      # Must run after the upload (it reads the requirements.txt just deployed)
      # and before the restart: if the install fails the job stops here, leaving
      # the old worker serving the old code rather than booting new code against
      # dependencies that were never installed.
      - name: Install Python dependencies in test virtualenv
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: |
            set -euo pipefail
            output=$(/usr/sbin/cloudlinux-selector install-modules --json \
              --interpreter python --app-root api_test \
              --requirements-file requirements.txt)
            echo "$output"
            # install-modules exits 0 even when pip fails, so the JSON "result"
            # field is the only reliable signal. Strip whitespace before matching
            # so the check survives minified JSON ("result":"success") as well as
            # the spaced form the selector emits today.
            if printf '%s' "$output" | tr -d '[:space:]' | grep -q '"result":"success"'; then
              echo "Dependencies installed."
            else
              echo "Dependency install failed; aborting before restart." >&2
              exit 1
            fi

      # Deletes files the upload did not put there, so the directory matches the
      # commit instead of the union of every deploy. See deploy-production.yml.
      - name: Prune files left behind by earlier deploys
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: |
            set -euo pipefail
            cd ./api_test

            # Refuse to prune against a manifest that is missing or implausibly
            # short: a truncated upload would otherwise read as "none of these
            # files belong here" and delete the entire application.
            if [ ! -s deploy-manifest.txt ] || [ "$(wc -l < deploy-manifest.txt)" -lt 10 ]; then
              echo "deploy-manifest.txt missing or too short; refusing to prune." >&2
              exit 1
            fi

            # Paths this deploy does not own, and must never delete. The rule
            # is "anything not in the manifest is stale", which is only safe
            # while the directory holds nothing but deployed code — and here it
            # does not. On test the app root *is* the subdomain's document
            # root, so cPanel's own files sit in the directory this step walks,
            # `.htaccess` among them. That file carries the CloudLinux
            # Passenger directives and every SetEnv the app reads. Delete it
            # and LiteSpeed stops handing requests to Passenger and serves a
            # directory listing instead: the app is unreachable, cPanel reports
            # it as "not configured", and the selector still cheerfully says
            # `started` because the registration is untouched. That took the
            # test API down from 2026-08-03 (when this step was introduced)
            # until 2026-08-05, with the deploy reporting success throughout.
            #
            # Production escaped only because its document root (~/api-sub) is
            # a different directory from its app root (~/api). That split is
            # cPanel configuration, not a guarantee, so both workflows carry
            # this list.
            protected='^(deploy-manifest\.txt|\.htaccess|\.user\.ini|stderr\.log)$|^(\.well-known|cgi-bin)/'

            find . -type f ! -path './tmp/*' \
              | sed 's|^\./||' \
              | LC_ALL=C sort > /tmp/deployed-files.$$
            # `|| true` because grep exits 1 when it filters everything out,
            # which pipefail would otherwise treat as a failure.
            LC_ALL=C comm -23 /tmp/deployed-files.$$ deploy-manifest.txt \
              | grep -Ev "$protected" > /tmp/stale-files.$$ || true

            if [ -s /tmp/stale-files.$$ ]; then
              echo "Removing $(wc -l < /tmp/stale-files.$$) stale file(s):"
              cat /tmp/stale-files.$$
              tr '\n' '\0' < /tmp/stale-files.$$ | xargs -0 -r rm -f --
              # Same reasoning for directories: cPanel creates .well-known (ACME
              # renewal) and cgi-bin empty, and an empty directory is exactly
              # what this sweep removes.
              find . -mindepth 1 -type d -empty ! -path './tmp*' \
                ! -name .well-known ! -name cgi-bin -delete
            else
              echo "No stale files."
            fi

            rm -f /tmp/deployed-files.$$ /tmp/stale-files.$$

      - name: Restart Python app (Passenger) in test
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: |
            mkdir -p ./api_test/tmp
            touch ./api_test/tmp/restart.txt

  verify-test-api:
    name: Verify Python API (test)
    needs: deploy-test-api
    runs-on: ubuntu-latest

    steps:
      # Passenger spawns a fresh worker on the first request after a restart,
      # which is slow (process boot + first-time OAuth token exchange for
      # Sheets). Without this warm-up, that cold-start cost lands on whichever
      # Cypress test happens to hit the API first, which can push it past the
      # form-submission timeout even though the app is healthy.
      - name: Verify API is responding
        run: curl --fail --max-time 15 --retry 5 --retry-delay 5 https://test-api.voteforjulia.com/health

  e2e-tests:
    name: Cypress e2e tests
    needs: [deploy-test-frontend, verify-test-api]
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Kept now that the redirect loop is understood, because it is the cheapest
      # detector for its return. The cause was the host's Imunify360 WAF
      # challenging the runner's IP, disabled site-wide on 2026-08-01
      # (docs/hosting.md#imunify360-waf-disabled) — but that is a host-side
      # setting we do not control. `server: openresty`, a ~12 kB body, or a
      # "One moment, please..." title here means it is back, and it shows up
      # before Cypress muddies the picture.
      - name: Record what the test site serves this runner
        run: |
          for path in / /donate /volunteer /yard-signs; do
            echo "--- ${path} ---"
            curl -sS --location --max-redirs 5 \
              -o /tmp/page.html -D /tmp/headers.txt \
              -w 'status=%{http_code} redirects=%{num_redirects} bytes=%{size_download} time=%{time_total}s\n' \
              "https://test.voteforjulia.com${path}" || true
            grep -iE '^(HTTP/|server:|location:|set-cookie:|content-type:|refresh:)' /tmp/headers.txt || true
            head -c 200 /tmp/page.html
            echo
          done

      - name: Run Cypress e2e tests
        uses: cypress-io/github-action@v7
        with:
          install-command: pnpm install --frozen-lockfile
          browser: chrome
          headed: false
        env:
          CYPRESS_BASE_URL: https://test.voteforjulia.com
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      # Screenshots only. Video recording was added to capture the looping page
      # during the redirect-loop hunt; the cause turned out to be the host's
      # Imunify360 WAF, disabled site-wide on 2026-08-01
      # (docs/hosting.md#imunify360-waf-disabled), so the recording no longer
      # earns the time it costs on every run. Cypress does not record video by
      # default, so removing CYPRESS_VIDEO above is the whole switch.
      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-failure-artifacts
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

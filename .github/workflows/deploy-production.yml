name: Deploy to production

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    # Matches `workflow_run.head_branch`, which is the branch the CI run was for
    # — NOT proof that the commit is on this repo's main. CI also runs on
    # `pull_request`, where head_branch is the PR's head branch, and a fork's
    # default branch is called `main` too. This filter is therefore a convenience,
    # not a trust boundary; the `if:` on every entry job below is the boundary.
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-frontend:
    name: Build frontend
    # Three conditions, and only the first is about CI health:
    #
    # - `conclusion == 'success'` — a failed or cancelled CI run must not deploy.
    # - `event == 'push'` — the CI run must have been triggered by a push, not by
    #   a `pull_request`. Without this, a PR from a fork whose head branch is
    #   named `main` (the default for a fresh fork) satisfies the `branches:`
    #   filter above, and the jobs below happily check out
    #   `workflow_run.head_sha` — the fork's commit — build it, and SCP the
    #   result over the live document root and the API app directory.
    # - `head_repository` — the commit must come from this repo, not a fork.
    #   Redundant against `event == 'push'` today (a fork's pushes cannot trigger
    #   our workflows), kept because it states the intent directly and costs
    #   nothing if the push condition is ever relaxed.
    #
    # The `environment: production` gates below do NOT cover this. Their only
    # protection rule is a branch policy for `main`, and a `workflow_run` job
    # runs with `github.ref` = the default branch regardless of which commit it
    # checked out — so the policy passes while the deployed bytes are the fork's.
    # There are no required reviewers.
    #
    # [deploy-test.yml](deploy-test.yml)'s `gate` job carries the same
    # `head_repository` check for the same reason.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Pin to the exact commit CI verified, not just the branch HEAD.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history, not a shallow clone: the sitemap dates each page from
          # the last commit that touched it (sitemap.build.ts). At depth 1 that
          # cannot work, and it fails silently in the worst way — `git log -1 --
          # <file>` reports the tip commit for *every* path, so all eight pages
          # get one identical date, which is the uniform lastmod this replaced.
          # `resolveSitemapEntries` detects the shallow clone and omits lastmod
          # rather than lying, so getting this wrong costs the dates, not the
          # deploy. Only this job needs it; the API deploy does no build.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          VITE_API_BASE_URL: https://api.voteforjulia.com
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          PUBLIC_BASE_URL: https://voteforjulia.com
        run: pnpm run build:deploy

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist
          include-hidden-files: true
          retention-days: 1

  deploy-frontend:
    name: Deploy frontend
    needs: build-frontend
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://voteforjulia.com

    steps:
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist

      - name: Prepare clean staging directory on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            rm -rf ./public_html_next
            mkdir -p ./public_html_next

      - name: Upload dist contents to staging directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          source: dist/**
          target: ./public_html_next
          overwrite: true
          strip_components: 1

      - name: Upload .htaccess to staging directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          source: dist/.htaccess
          target: ./public_html_next
          overwrite: true
          strip_components: 1

      # The staged file ships with a placeholder rather than the token, because
      # the repo is public. Substituted here rather than at build time so the
      # secret never lands on the runner's filesystem or in an artifact.
      #
      # An unset secret DELETES the gate instead of leaving the placeholder.
      # Left literal, the rule demands a header no caller can send and refuses
      # every visitor — so a missing secret has to fail open, not closed. The
      # API's own check defaults off for the same reason. See ADR-0020.
      - name: Substitute the edge token into the staged .htaccess
        uses: appleboy/ssh-action@v1.2.5
        env:
          EDGE_TOKEN: ${{ secrets.EDGE_SHARED_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          envs: EDGE_TOKEN
          script: |
            set -euo pipefail
            staged=./public_html_next/.htaccess

            if [ ! -s "$staged" ]; then
              echo "Staged $staged is missing or empty; aborting before the swap." >&2
              exit 1
            fi

            if [ -z "${EDGE_TOKEN:-}" ]; then
              sed -i '/# BEGIN EDGE GATE/,/# END EDGE GATE/d' "$staged"
              echo "EDGE_SHARED_TOKEN unset; edge gate removed, origin left open."
            else
              # Alphanumeric only. The value is interpolated into a sed
              # replacement and then into a RewriteCond regex, and a
              # metacharacter would either corrupt the file or quietly change
              # what the rule matches.
              case "$EDGE_TOKEN" in
                *[!A-Za-z0-9]*)
                  echo "EDGE_SHARED_TOKEN must be alphanumeric; aborting." >&2
                  exit 1
                  ;;
              esac
              # A guessed token is as good as a leaked one, and refused callers
              # are the ones the edge's rate limiting never saw -- so the 403
              # is an unmetered oracle to guess against. Nothing else here sets
              # a floor: the character-set check above passes a one-character
              # token. Generation command in docs/hosting.md.
              if [ "${#EDGE_TOKEN}" -lt 32 ]; then
                echo "EDGE_SHARED_TOKEN must be at least 32 characters; got ${#EDGE_TOKEN}. Aborting." >&2
                exit 1
              fi
              # Pin the substitution to exactly one placeholder, on exactly the
              # gate condition, before touching the file. Two distinct failures
              # need this and the "survived" guard below catches neither:
              #
              #   - No placeholder at all. `sed` succeeds having replaced
              #     nothing, so the step reports a gate it did not install --
              #     true while this step is merged ahead of the gate block per
              #     ADR-0020, and true again if the block is ever dropped.
              #   - A SECOND placeholder somewhere else. `sed` substitutes the
              #     first match on EVERY line, so a copied gate block or a
              #     `Header set` naming the placeholder gets the token too, and
              #     nothing is left over for the guard below to notice. That
              #     publishes the secret in a served response header.
              gate='RewriteCond %{HTTP:X-Origin-Token} !^@@EDGE_TOKEN@@$'
              occurrences=$(grep -o '@@EDGE_TOKEN@@' "$staged" | wc -l | tr -d '[:space:]' || true)
              gate_lines=$(grep -F -x "$gate" "$staged" | wc -l | tr -d '[:space:]' || true)
              if [ "$occurrences" != "1" ] || [ "$gate_lines" != "1" ]; then
                echo "Expected exactly one @@EDGE_TOKEN@@ in $staged, on the gate RewriteCond; found $occurrences occurrence(s) and $gate_lines gate line(s). Aborting before the swap." >&2
                exit 1
              fi
              sed -i "s/@@EDGE_TOKEN@@/$EDGE_TOKEN/" "$staged"
              echo "Edge gate armed."
            fi

            # Neither branch may leave a placeholder behind: that is the shape
            # of the total-outage failure, so it is worth failing the deploy for.
            if grep -q '@@EDGE_TOKEN@@' "$staged"; then
              echo "Placeholder survived substitution; aborting before the swap." >&2
              exit 1
            fi

            # The range delete above runs to EOF if the END marker is ever lost,
            # truncating this file to its first few lines. Neither guard above
            # catches that: the placeholder is gone either way and the file is
            # still non-empty. Assert something from the far end of the file
            # instead -- losing the CSP silently is what ADR-0010 warns about.
            if ! grep -q 'Content-Security-Policy' "$staged"; then
              echo "Staged $staged lost its CSP; aborting before the swap." >&2
              exit 1
            fi

      # cPanel's IP Blocker appends `deny from` lines to the .htaccess of EVERY
      # document root on the account, and renders its UI list from
      # public_html/.htaccess alone. Replacing that file wholesale therefore
      # drops the main site's blocks *and* empties the screen, while the copies
      # under ~/api-sub keep enforcing invisibly — so an address stays refused
      # by api.voteforjulia.com with nothing left in cPanel to un-block it.
      # Observed 2026-08-10; see docs/hosting.md.
      #
      # So the block is rebuilt into the staged file before the swap, from the
      # UNION of the live docroot and the API docroot. The union — rather than
      # merely preserving public_html's copy — is what repairs an already
      # orphaned entry: it reappears in the UI, where removing it clears every
      # docroot at once. It never widens enforcement, because a unioned address
      # is by definition already being refused by the API.
      #
      # Reconstructed rather than copied verbatim so the output does not depend
      # on how the source files happen to be ordered. The <Files 403.shtml>
      # stanza is cPanel's own, and keeps the 403 document itself reachable.
      - name: Carry cPanel IP Blocker rules into the staged .htaccess
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            staged=./public_html_next/.htaccess

            # .htaccess arrives in its own scp step because the dist/** glob
            # does not match dotfiles. If that step ever silently fails,
            # appending here would create a file holding deny rules and no CSP
            # at all — the exact silent loss ADR-0010 warns about. Fail loudly.
            if [ ! -s "$staged" ]; then
              echo "Staged $staged is missing or empty; aborting before the swap." >&2
              exit 1
            fi

            denies=$(
              for f in ./public_html/.htaccess ./api-sub/.htaccess; do
                [ -f "$f" ] || continue
                grep -iE '^[[:space:]]*deny[[:space:]]+from[[:space:]]+[^[:space:]]+[[:space:]]*$' "$f" || true
              done | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/[[:space:]]+/ /g' \
                   | tr 'A-Z' 'a-z' | LC_ALL=C sort -u
            )

            if [ -z "$denies" ]; then
              echo "No cPanel IP Blocker rules to carry over."
              exit 0
            fi

            {
              echo ""
              echo "# --- cPanel IP Blocker rules, carried across this deploy ---"
              echo "# Managed from cPanel > IP Blocker, never from this repo."
              echo "# Rebuilt on every deploy from the union of the live and API docroots."
              echo "<Files 403.shtml>"
              echo "order allow,deny"
              echo "allow from all"
              echo "</Files>"
              echo ""
              printf '%s\n' "$denies"
            } >> "$staged"

            # Count only. This repo is public, so its Actions logs are public
            # too, and the addresses are the one thing here worth not
            # publishing — a residential IP reassigned to a real supporter
            # would otherwise be named in a permanent public log.
            echo "Carried over $(printf '%s\n' "$denies" | wc -l | tr -d ' ') IP Blocker rule(s)."

      - name: Atomically swap staging into the live document root
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            if [ ! -d ./public_html_next ]; then
              echo "Staging directory ./public_html_next is missing; aborting swap." >&2
              exit 1
            fi
            # Remove the previous rollback snapshot, demote the current live
            # document root to the rollback slot, then promote staging. The two
            # renames are atomic on the same filesystem, so the live directory is
            # only momentarily absent (sub-second) instead of serving a mix of old
            # and new files during a multi-step upload.
            rm -rf ./public_html_prev
            if [ -d ./public_html ]; then
              mv ./public_html ./public_html_prev
            fi
            mv ./public_html_next ./public_html
            echo "Swapped new build into ./public_html (previous build kept at ./public_html_prev)."

  verify-frontend:
    name: Verify frontend
    needs: deploy-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Verify frontend is responding
        run: curl --fail --max-time 15 --retry 3 --retry-delay 5 https://voteforjulia.com

  deploy-api:
    name: Deploy Python API
    # Same gate as build-frontend — see the comment there for why the
    # `branches:` filter is not sufficient on its own. This job is the more
    # dangerous of the two: it uploads `api/**` and touches restart.txt, so an
    # unguarded fork commit would be arbitrary Python running on the host that
    # holds the SMTP credentials and the Sheets service account.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.voteforjulia.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      # The scp below only adds and overwrites — it never deletes, so a module
      # that was renamed or removed in the repo lingers on the host forever and
      # stays importable. This manifest is what lets the prune step afterwards
      # tell "belongs here" from "left over from an older deploy". It ships as
      # part of the upload rather than being interpolated into a shell script,
      # so no file name ever reaches the server as `${{ }}`-expanded text.
      #
      # Runtime files only: the test suite and dev requirements are excluded, so
      # the prune removes them from the host too. They are uploaded and then
      # deleted, which is mildly wasteful and much simpler than teaching
      # scp-action to filter — one mechanism decides what production contains.
      - name: Write deploy manifest
        run: |
          set -euo pipefail
          # LC_ALL=C here and in the prune step: `comm` compares the two lists
          # byte-for-byte and they are sorted on different machines, so a
          # collation difference between the runner and the host would make it
          # report files as stale that are not.
          git ls-files api \
            | sed 's|^api/||' \
            | grep -v -E '(^|/)test_[^/]+\.py$' \
            | grep -v -E '^requirements-dev\.txt$' \
            | LC_ALL=C sort > api/deploy-manifest.txt
          echo "Manifest lists $(wc -l < api/deploy-manifest.txt) runtime file(s)."

      - name: Upload api contents to server api directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          source: api/**
          target: ./api
          overwrite: true
          strip_components: 1

      # Must run after the upload (it reads the requirements.txt just deployed)
      # and before the restart: if the install fails the job stops here, leaving
      # the old worker serving the old code rather than booting new code against
      # dependencies that were never installed.
      - name: Install Python dependencies in production virtualenv
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            output=$(/usr/sbin/cloudlinux-selector install-modules --json \
              --interpreter python --app-root api \
              --requirements-file requirements.txt)
            echo "$output"
            # install-modules exits 0 even when pip fails, so the JSON "result"
            # field is the only reliable signal. Strip whitespace before matching
            # so the check survives minified JSON ("result":"success") as well as
            # the spaced form the selector emits today.
            if printf '%s' "$output" | tr -d '[:space:]' | grep -q '"result":"success"'; then
              echo "Dependencies installed."
            else
              echo "Dependency install failed; aborting before restart." >&2
              exit 1
            fi

      # Deletes files the upload did not put there — a renamed module, a service
      # that was split up, the test suite. Runs after the install (a failed
      # install must abort before anything else changes) and before the restart,
      # so the worker that boots next sees a directory matching the commit
      # exactly rather than the union of every deploy since the app was created.
      #
      # `tmp/` is excluded because it is Passenger's, not ours — restart.txt
      # lives there. The virtualenvs are not at risk either way: they live in
      # ~/virtualenv/api/3.11, outside the app root (docs/hosting.md).
      - name: Prune files left behind by earlier deploys
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            cd ./api

            # Refuse to prune against a manifest that is missing or implausibly
            # short. Without this guard a truncated upload would read as "none of
            # these files belong here" and delete the entire application.
            if [ ! -s deploy-manifest.txt ] || [ "$(wc -l < deploy-manifest.txt)" -lt 10 ]; then
              echo "deploy-manifest.txt missing or too short; refusing to prune." >&2
              exit 1
            fi

            # Paths this deploy does not own, and must never delete. Kept in
            # step with deploy-test.yml, where the same rule took the test API
            # down for two days: there the app root doubles as the subdomain's
            # document root, so `.htaccess` — the CloudLinux Passenger config
            # and every SetEnv — sat in the directory being pruned and was
            # removed as "stale", leaving LiteSpeed serving a directory listing.
            #
            # Production is currently spared because its document root
            # (~/api-sub) is a different directory from this app root (~/api).
            # That is cPanel configuration and could be changed from a web UI
            # without anyone touching this repo, so the guard belongs here too:
            # `stderr.log` is already being deleted on every deploy, which is
            # why a crash here leaves no trace to read afterwards.
            protected='^(deploy-manifest\.txt|\.htaccess|\.user\.ini|stderr\.log)$|^(\.well-known|cgi-bin)/'

            # `sed` rather than find's `-printf '%P\n'`, which is GNU-only —
            # this way the script is portable enough to run and verify locally.
            find . -type f ! -path './tmp/*' \
              | sed 's|^\./||' \
              | LC_ALL=C sort > /tmp/deployed-files.$$
            # `|| true` because grep exits 1 when it filters everything out,
            # which pipefail would otherwise treat as a failure.
            LC_ALL=C comm -23 /tmp/deployed-files.$$ deploy-manifest.txt \
              | grep -Ev "$protected" > /tmp/stale-files.$$ || true

            if [ -s /tmp/stale-files.$$ ]; then
              echo "Removing $(wc -l < /tmp/stale-files.$$) stale file(s):"
              cat /tmp/stale-files.$$
              # -r so an empty list is a no-op, -- so a leading dash is a path.
              tr '\n' '\0' < /tmp/stale-files.$$ | xargs -0 -r rm -f --
              # cPanel creates .well-known (ACME renewal) and cgi-bin empty, and
              # an empty directory is exactly what this sweep removes.
              find . -mindepth 1 -type d -empty ! -path './tmp*' \
                ! -name .well-known ! -name cgi-bin -delete
            else
              echo "No stale files."
            fi

            rm -f /tmp/deployed-files.$$ /tmp/stale-files.$$

      - name: Restart Python app (Passenger)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p ./api/tmp
            touch ./api/tmp/restart.txt

  verify-api:
    name: Verify Python API
    needs: deploy-api
    runs-on: ubuntu-latest

    steps:
      - name: Verify API is responding
        run: curl --fail --max-time 15 --retry 5 --retry-delay 5 https://api.voteforjulia.com/health

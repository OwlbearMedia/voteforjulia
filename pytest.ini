[pytest]
# Backend tests only; the frontend suite is Vitest.
testpaths = api scripts

# The existing api/test_*.py files are unittest.TestCase classes, which pytest
# collects natively — adopting pytest as the runner needed no test changes.
# New tests can be written as plain functions (see api/test_openapi_spec.py);
# both styles run side by side, so conversion can happen file by file.
#
# Imports resolve as the top-level `api` package because api/__init__.py exists
# and the repo root does not, so pytest puts the repo root on sys.path.
addopts = --strict-markers
